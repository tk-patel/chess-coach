<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trainer — chess-coach</title>
<style>
  :root { --bg:#fff; --fg:#1c1c1e; --muted:#6b6b70; --card:#f4f4f6; --line:#e2e2e6;
          --accent:#4a78c2; --ok:#4c9f70; --bad:#c0504d; --sel:#f0c674; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121316; --fg:#e8e8ea; --muted:#9a9aa2; --card:#1d1e22;
            --line:#2b2c31; --accent:#7aa2e3; --sel:#7a6a2a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header, main { max-width:640px; margin:0 auto; padding:0 12px; }
  header { padding-top:14px; }
  h1 { font-size:1.25rem; margin:.2rem 0 .6rem; }
  h1 a { color:var(--accent); text-decoration:none; font-size:.8rem; font-weight:400; margin-left:8px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  select, button { font:inherit; padding:6px 8px; border-radius:8px; border:1px solid var(--line);
                   background:var(--card); color:var(--fg); }
  button { cursor:pointer; }
  button.primary { border-color:var(--accent); color:var(--accent); }
  #boardwrap { width:100%; max-width:520px; margin:0 auto; }
  svg#board { width:100%; height:auto; display:block; touch-action:manipulation; }
  .sq-light { fill:#eadfc8; } .sq-dark { fill:#b58863; }
  .sq-sel { fill:var(--sel); }
  .coord { font-size:11px; fill:var(--muted); }
  .glyph-w { fill:#fff; stroke:#333; stroke-width:1; }
  .glyph-b { fill:#111; stroke:#ddd; stroke-width:1; }
  text.glyph { font-size:40px; text-anchor:middle; dominant-baseline:central; user-select:none; }
  .status { margin:12px 0; min-height:1.4em; font-weight:600; }
  .status.ok { color:var(--ok); } .status.bad { color:var(--bad); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px;
           padding:10px 12px; margin:10px 0; }
  .panel .tag { display:inline-block; background:var(--bg); border:1px solid var(--line);
                border-radius:6px; padding:0 6px; margin:0 3px 3px 0; font-size:.8rem; }
  .muted { color:var(--muted); font-size:.85rem; }
  .promo { display:flex; gap:6px; margin-top:8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  a { color:var(--accent); }
  @media (max-width:400px){ text.glyph{ font-size:34px; } }
</style>
</head>
<body>
<header>
  <h1>Puzzle trainer <a href="index.html">← report</a></h1>
</header>
<main>
  <div class="controls">
    <select id="f-motif"></select>
    <select id="f-phase"></select>
    <select id="f-clock"><option value="">any clock</option><option value="1">time trouble</option><option value="0">normal</option></select>
    <select id="f-window"><option value="all">all time</option><option value="30">last 30d</option><option value="90">last 90d</option><option value="365">last 365d</option></select>
    <button id="export" class="muted">Export progress</button>
    <button id="import" class="muted">Import progress</button>
    <input id="importfile" type="file" accept="application/json" hidden>
  </div>

  <div id="boardwrap"><svg id="board" viewBox="0 0 440 440" aria-label="chess board"></svg></div>
  <div id="status" class="status"></div>

  <div id="promo" class="promo" hidden>
    <button data-p="q">Queen</button><button data-p="r">Rook</button>
    <button data-p="b">Bishop</button><button data-p="n">Knight</button>
  </div>

  <div id="result" hidden>
    <div class="panel">
      <div id="res-line"></div>
      <div id="res-meta" class="muted"></div>
      <div id="res-motifs"></div>
      <div class="row">
        <button id="retry">Retry</button>
        <button id="reveal">Reveal</button>
        <button id="next" class="primary">Next</button>
      </div>
    </div>
  </div>
  <div id="queueinfo" class="muted"></div>

  <script type="application/json" id="puzzles">{{ puzzles_json|safe }}</script>
</main>
<script>
(function () {
  "use strict";
  var KEY = "chesscoach.srs.v1";
  var INTERVALS = [0, 1, 3, 7, 21]; // days for box 1..5
  var DAY = 86400000;
  var GLYPH = {K:"\u2654",Q:"\u2655",R:"\u2656",B:"\u2657",N:"\u2658",P:"\u2659",
               k:"\u265A",q:"\u265B",r:"\u265C",b:"\u265D",n:"\u265E",p:"\u265F"};

  var puzzles = JSON.parse(document.getElementById("puzzles").textContent || "[]");
  var byId = {};
  puzzles.forEach(function (p) { byId[p.id] = p; });

  // --- SRS state (localStorage, guarded) ----------------------------------
  function loadState() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
                         catch (e) { return {}; } }
  function saveState(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  var SRS = loadState();
  function now() { return Date.now(); }
  function isNew(id) { return !SRS[id]; }
  function isDue(id) { return SRS[id] && (SRS[id].due || 0) <= now(); }
  function boxOf(id) { return SRS[id] ? SRS[id].box : 1; }

  // --- filters -------------------------------------------------------------
  var filters = { motif: "", phase: "", clock: "", window: "all" };
  function withinWindow(p) {
    if (filters.window === "all" || !p.date) return true;
    var age = (now() - Date.parse(p.date)) / DAY;
    return age <= parseInt(filters.window, 10);
  }
  function passes(p) {
    if (filters.motif && (p.motifs || []).indexOf(filters.motif) < 0) return false;
    if (filters.phase && p.phase !== filters.phase) return false;
    if (filters.clock !== "" && String(p.low_clock ? 1 : 0) !== filters.clock) return false;
    return withinWindow(p);
  }

  // --- queue ---------------------------------------------------------------
  var queue = [];
  function buildQueue() {
    var pool = puzzles.filter(passes);
    var due = pool.filter(function (p) { return isDue(p.id); })
      .sort(function (a, b) { return boxOf(a.id) - boxOf(b.id)
        || (SRS[a.id].due - SRS[b.id].due); });
    var fresh = pool.filter(function (p) { return isNew(p.id); })
      .sort(function (a, b) { return b.win_drop - a.win_drop; });
    queue = due.concat(fresh);
    document.getElementById("queueinfo").textContent =
      queue.length + " in queue (" + due.length + " due, " + fresh.length + " new)";
  }

  // --- board rendering -----------------------------------------------------
  var SQ = 50, M = 20, selected = null, pendingPromo = null, current = null;
  function fenParts(fen) { return fen.split(" "); }
  function boardMap(fen) {
    var rows = fenParts(fen)[0].split("/");
    var map = {};
    for (var r = 0; r < 8; r++) {
      var file = 0;
      for (var i = 0; i < rows[r].length; i++) {
        var ch = rows[r][i];
        if (/\d/.test(ch)) { file += parseInt(ch, 10); }
        else { map[String.fromCharCode(97 + file) + (8 - r)] = ch; file++; }
      }
    }
    return map;
  }
  function xy(file, rank, flipped) {
    var fx = flipped ? 7 - file : file;
    var ry = flipped ? rank : 7 - rank;
    return { x: M + fx * SQ, y: M + ry * SQ };
  }
  function render(fen, flipped) {
    var map = boardMap(fen);
    var out = "";
    for (var r = 0; r < 8; r++) for (var f = 0; f < 8; f++) {
      var sq = String.fromCharCode(97 + f) + (r + 1);
      var pos = xy(f, r, flipped);
      var light = (f + r) % 2 === 1;
      var cls = selected === sq ? "sq-sel" : (light ? "sq-light" : "sq-dark");
      out += '<rect class="' + cls + '" data-sq="' + sq + '" x="' + pos.x + '" y="' + pos.y +
             '" width="' + SQ + '" height="' + SQ + '"/>';
    }
    for (var sq2 in map) {
      var f2 = sq2.charCodeAt(0) - 97, r2 = sq2.charCodeAt(1) - 49;
      var pos2 = xy(f2, r2, flipped);
      var ch2 = map[sq2];
      var c = ch2 === ch2.toUpperCase() ? "glyph-w" : "glyph-b";
      out += '<text class="glyph ' + c + '" x="' + (pos2.x + SQ / 2) + '" y="' + (pos2.y + SQ / 2 + 1) +
             '">' + GLYPH[ch2] + "</text>";
    }
    for (var i = 0; i < 8; i++) {
      var fL = flipped ? 7 - i : i;
      var rL = flipped ? i : 7 - i;
      out += '<text class="coord" x="' + (M + i * SQ + SQ / 2 - 3) + '" y="' + (M + 8 * SQ + 13) + '">' +
             String.fromCharCode(97 + fL) + "</text>";
      out += '<text class="coord" x="' + (M - 14) + '" y="' + (M + i * SQ + SQ / 2 + 4) + '">' +
             (rL + 1) + "</text>";
    }
    document.getElementById("board").innerHTML = out;
  }

  // --- move building / checking -------------------------------------------
  function turn(fen) { return fenParts(fen)[1] === "w" ? "w" : "b"; }
  function onSquareClick(sq) {
    if (!current) return;
    var map = boardMap(current.fen);
    var piece = map[sq];
    if (selected) {
      if (sq === selected) { selected = null; render(current.fen, current._flip); return; }
      var from = selected, to = sq;
      var moving = map[from];
      var promo = "";
      if (moving && moving.toLowerCase() === "p" && (to[1] === "8" || to[1] === "1")) {
        pendingPromo = { from: from, to: to };
        document.getElementById("promo").hidden = false;
        return;
      }
      attempt(from, to, promo);
    } else if (piece) {
      var isWhite = piece === piece.toUpperCase();
      var mover = turn(current.fen);
      if ((isWhite && mover === "w") || (!isWhite && mover === "b")) {
        selected = sq; render(current.fen, current._flip);
      }
    }
  }
  function attempt(from, to, promo) {
    selected = null; pendingPromo = null;
    document.getElementById("promo").hidden = true;
    var uci = from + to + promo;
    current._attempts++;
    if (current.accepted.indexOf(uci) >= 0) {
      finish(true);
    } else {
      current._wrong = true;
      setStatus("Not quite. You played " + current.played_san + " in the real game.", "bad");
      render(current.fen, current._flip);
    }
  }
  function setStatus(text, cls) {
    var el = document.getElementById("status");
    el.textContent = text; el.className = "status" + (cls ? " " + cls : "");
  }
  function finish(correct) {
    var p = current;
    var e = SRS[p.id] || { box: 0, attempts: 0, correct: 0 };
    e.attempts += p._attempts || (correct ? 1 : 0);
    var bump = correct && !p._wrong && p._attempts === 1;
    if (bump) { e.box = Math.min(5, boxOf(p.id) + 1); e.correct += 1; }
    else { e.box = 1; }
    e.due = now() + INTERVALS[e.box - 1] * DAY;
    SRS[p.id] = e;
    saveState(SRS);
    setStatus(bump ? "Correct! Box " + e.box + "." : (correct ? "Solved." : "Revealed — back to box 1."),
              bump || correct ? "ok" : "bad");
    showResult();
    buildQueue();
  }
  function showResult() {
    var p = current;
    document.getElementById("result").hidden = false;
    document.getElementById("res-line").innerHTML =
      "<strong>Solution:</strong> " + p.solution_san +
      (p.line_san ? " — <span class='muted'>" + p.line_san + "</span>" : "");
    var meta = [];
    if (p.opening) meta.push(p.opening);
    if (p.date) meta.push(p.date);
    meta.push("drop " + p.win_drop + " win%");
    meta.push("box " + boxOf(p.id));
    document.getElementById("res-meta").textContent = meta.join(" · ");
    var m = document.getElementById("res-motifs");
    m.innerHTML = (p.motifs || []).map(function (t) {
      return "<span class='tag'>" + t.replace(/_/g, " ") + "</span>"; }).join("");
    if (p.game_url) {
      m.innerHTML += " <a href='" + p.game_url + "' target='_blank' rel='noopener'>game</a>";
    }
  }

  // --- navigation ----------------------------------------------------------
  function next() {
    if (!queue.length) {
      current = null;
      document.getElementById("board").innerHTML = "";
      document.getElementById("result").hidden = true;
      setStatus("No puzzles in the queue. Try widening the filters.", "");
      return;
    }
    current = queue.shift();
    current._flip = current.orientation !== "white";
    current._attempts = 0; current._wrong = false;
    selected = null;
    document.getElementById("result").hidden = true;
    document.getElementById("promo").hidden = true;
    setStatus(current.orientation === "white" ? "White to move — find the best move."
                                              : "Black to move — find the best move.", "");
    render(current.fen, current._flip);
  }

  // --- wiring --------------------------------------------------------------
  document.getElementById("board").addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-sq]");
    if (t) onSquareClick(t.getAttribute("data-sq"));
  });
  document.querySelectorAll("#promo button").forEach(function (b) {
    b.addEventListener("click", function () {
      if (pendingPromo) attempt(pendingPromo.from, pendingPromo.to, b.getAttribute("data-p"));
    });
  });
  document.getElementById("reveal").addEventListener("click", function () {
    if (current) finish(false);
  });
  document.getElementById("retry").addEventListener("click", function () {
    if (!current) return;
    current._attempts = 0; current._wrong = false; selected = null;
    document.getElementById("result").hidden = true;
    setStatus("Try again.", "");
    render(current.fen, current._flip);
  });
  document.getElementById("next").addEventListener("click", next);

  // filters
  var motifSel = document.getElementById("f-motif");
  var phaseSel = document.getElementById("f-phase");
  var motifs = {};
  puzzles.forEach(function (p) { (p.motifs || []).forEach(function (t) { motifs[t] = 1; }); });
  motifSel.innerHTML = '<option value="">any motif</option>' +
    Object.keys(motifs).sort().map(function (t) {
      return '<option value="' + t + '">' + t.replace(/_/g, " ") + "</option>"; }).join("");
  phaseSel.innerHTML = '<option value="">any phase</option>' +
    ["opening", "middlegame", "endgame"].map(function (p) {
      return '<option value="' + p + '">' + p + "</option>"; }).join("");
  function applyFilters() { buildQueue(); next(); }
  motifSel.addEventListener("change", function () { filters.motif = this.value; applyFilters(); });
  phaseSel.addEventListener("change", function () { filters.phase = this.value; applyFilters(); });
  document.getElementById("f-clock").addEventListener("change", function () { filters.clock = this.value; applyFilters(); });
  document.getElementById("f-window").addEventListener("change", function () { filters.window = this.value; applyFilters(); });

  // export / import
  document.getElementById("export").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(SRS)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "chesscoach-srs.json";
    document.body.appendChild(a); a.click(); a.remove();
  });
  document.getElementById("import").addEventListener("click", function () {
    document.getElementById("importfile").click();
  });
  document.getElementById("importfile").addEventListener("change", function (ev) {
    var file = ev.target.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try { SRS = JSON.parse(reader.result); saveState(SRS); applyFilters(); }
      catch (e) { setStatus("Could not read that file.", "bad"); }
    };
    reader.readAsText(file);
  });

  // motif via URL hash (#motif=hung_piece)
  var hash = /motif=([a-z_]+)/.exec(location.hash || "");
  if (hash) { filters.motif = hash[1]; motifSel.value = hash[1]; }

  buildQueue();
  next();
})();
</script>
</body>
</html>
