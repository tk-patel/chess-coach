[project]
name = "chesscoach"
version = "0.1.0"
description = "Analyze chess.com games with Stockfish; build a blunder profile and a personal puzzle trainer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-chess>=1.10",
    "requests>=2.31",
    "typer>=0.12",
    "jinja2>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
chesscoach = "chesscoach.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "engine: requires the Stockfish binary",
]
